<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
<title>Login</title>

<link rel="stylesheet" href="css/login.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="login-bg">

  <div class="login-card">

    <img src="/front-end/images/project logo.png" class="logo">

    <h2 class="title">
      ระบบจัดการคลังชิ้นเนื้อโคขุน
    </h2>

    <p class="subtitle">
      กรุณาเข้าสู่ระบบเพื่อจัดการคลังชิ้นเนื้อ
    </p>

    <form class="login-form">

      <div class="form-group">
        <label>ชื่อผู้ใช้ :</label>
        <input type="text" placeholder="กรุณากรอกชื่อผู้ใช้">
      </div>

      <div class="form-group">
        <label>รหัสผ่าน :</label>
        <input type="password" placeholder="กรุณากรอกรหัสผ่าน">
      </div>

      <button class="login-btn">Sign In</button>

      <div class="login-links">
        <a href="#">สมัครสมาชิก</a>
        <a href="#">ลืมรหัสผ่าน?</a>
      </div>

    </form>
  </div>
</body>
</html>
